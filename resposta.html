<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table {
            /* Largura da colunas */
        width: 400px;
        /* Para unir as linhas entre as celulas */
        border-collapse: collapse;
        }
        td, th {
            border: 1px solid black;
            padding: 8px;
        }
    </style>
</head>
<body>
    <table>
    <h1>Exemplo esperado a saída </h1>
    <tr>
        <th>Nome do Produto</th>
        <th>Categoria</th>
        <th>Preço (R$)</th>
        <th>Estoque</th>
    </tr>

    <tr>
        <td>Camiseta</td>
        <td>Vestuário</td>
        <td>49,90</td>
        <td>20</td>
    </tr>

    <tr>
        <td>Notebook</td>
        <td>Eletrônicos</td>
        <td>3.500,00</td>
        <td>5</td>
    </tr>

    <tr>
        <td>Café Gourmet</td>
        <td>Alimentos</td>
        <td>29,90</td>
        <td>15</td>
    </tr>
</table>

</body>
</html>
